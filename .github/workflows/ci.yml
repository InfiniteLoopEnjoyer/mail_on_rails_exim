name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Advisories land between pushes; a daily re-scan catches new CVEs in
  # the image (Exim itself ships from Debian packages, and Exim has a long
  # CVE history) even when the repo is quiet. Tests are skipped on the
  # scheduled runs - only the image scan repeats.
  schedule:
    - cron: "53 5 * * *"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The helpers and their tests are stdlib-only (no Gemfile); setup-ruby
      # just provides the Ruby from .ruby-version.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Run tests
        run: bin/test

  scan_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t mail_on_rails_exim:ci .

      # Scans the OS layer: exim4-daemon-heavy and everything else Debian
      # in ruby:slim. ignore-unfixed skips CVEs Debian has no patch for
      # yet - failing on those would just leave CI permanently red.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: mail_on_rails_exim:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
